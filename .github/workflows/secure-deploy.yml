name: "Deploy with Security Checks"

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      server_type:
        description: "Server type"
        required: true
        type: choice
        options:
          - vps
          - local
        default: vps

      ssh_local_tunnel_dns_host:
        description: "Local server Cloudflare SSH hostname"
        required: false
        type: string

      ssh_local_private_key:
        description: "Local server SSH private key"
        required: false
        type: string

permissions:
  contents: write
  actions: read
  security-events: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  security:
    uses: ./.github/workflows/shared-jops.yml
    with:
      deploy: true
      server_type: ${{ inputs.server_type || 'vps' }}
      ssh_local_tunnel_dns_host: ${{ inputs.ssh_local_tunnel_dns_host }}
      ssh_local_private_key: ${{ inputs.ssh_local_private_key }}
    secrets: inherit
