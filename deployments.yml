# deployments template for fallback; contains placeholders {{NAMESPACE}}, {{HOSTNAME}}, {{IMAGE}}

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: "{{NAMESPACE}}"

---
 
---
# Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: verdaccio-cert
  namespace: "{{NAMESPACE}}"
spec:
  secretName: verdaccio-cert-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "{{HOSTNAME}}"




---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio-deployment
  namespace: "{{NAMESPACE}}"
  labels:
    app: verdaccio-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: verdaccio-deployment

  template:
    metadata:
      labels:
        app: verdaccio-deployment

    spec:
      containers:
        - name: verdaccio
          image: "{{IMAGE}}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4873
              name: http

          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: PORT

            - name: SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: SECRET_TOKEN

          volumeMounts:
            - name: verdaccio-storage
              mountPath: /verdaccio/storage

            - name: verdaccio-htpasswd
              mountPath: /verdaccio/conf/htpasswd

      volumes:
        - name: verdaccio-storage
          hostPath:
            path: /mnt/r2/verdaccio/storage
            type: DirectoryOrCreate

        - name: verdaccio-htpasswd
          hostPath:
            path: /mnt/r2/verdaccio/conf/htpasswd
            type: FileOrCreate

      imagePullSecrets:
        - name: dockerhub-secret

 
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: verdaccio-service
  namespace: "{{NAMESPACE}}"
  labels:
    app: verdaccio-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4873
      protocol: TCP
      name: http
  selector:
    app: verdaccio-deployment

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verdaccio-ingress
  namespace: "{{NAMESPACE}}"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "{{HOSTNAME}}"
      secretName: verdaccio-cert-tls
  rules:
    - host: "{{HOSTNAME}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verdaccio-service
                port:
                  number: 80


---
# GlobalNetworkPolicy
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: allow-verdaccio-internet
spec:
  selector: app == "verdaccio-deployment"

  namespaceSelector: kubernetes.io/metadata.name == "yahyeapps"

  types:
    - Egress

  egress:
    - action: Allow
      destination:
        nets:
          - 0.0.0.0/0
 
