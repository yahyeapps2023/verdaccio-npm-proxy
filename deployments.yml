# deployments template for fallback; contains placeholders {{NAMESPACE}}, {{HOSTNAME}}, {{IMAGE}}

---

# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: "{{NAMESPACE}}"

---

# TLS Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: verdaccio-cert
  namespace: "{{NAMESPACE}}"
spec:
  secretName: verdaccio-cert-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "{{HOSTNAME}}"
  dnsNames:
    - "{{HOSTNAME}}"

---

# Persistent storage for htpasswd
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verdaccio-htpasswd-pvc
  namespace: "{{NAMESPACE}}"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
  storageClassName: local-path

---

# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: verdaccio-deployment
  namespace: "{{NAMESPACE}}"
  labels:
    app: verdaccio-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: verdaccio-deployment

  template:
    metadata:
      labels:
        app: verdaccio-deployment

    spec:
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: dockerhub-secret

      initContainers:
        - name: fix-htpasswd-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Checking htpasswd path..."

              if [ -d /data/htpasswd ]; then
                echo "Removing wrong htpasswd directory..."
                rm -rf /data/htpasswd
              fi

              if [ ! -f /data/htpasswd ]; then
                echo "Creating htpasswd file..."
                touch /data/htpasswd
              fi

              chown 10001:0 /data/htpasswd
              chmod 664 /data/htpasswd

              echo "Final state:"
              ls -la /data

          volumeMounts:
            - name: verdaccio-conf
              mountPath: /data

      containers:
        - name: verdaccio
          image: "{{IMAGE}}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4873

          env:
            - name: SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: SECRET_TOKEN

            - name: R2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: R2_BUCKET

            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: S3_ACCESS_KEY_ID

            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: S3_SECRET_ACCESS_KEY

            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: R2_ENDPOINT

            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: verdaccio-secrets
                  key: PORT

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: verdaccio-conf
              mountPath: /verdaccio/conf/htpasswd-dir

      volumes:
        - name: verdaccio-conf
          persistentVolumeClaim:
            claimName: verdaccio-htpasswd-pvc

---

# Service
apiVersion: v1
kind: Service
metadata:
  name: verdaccio-service
  namespace: "{{NAMESPACE}}"
  labels:
    app: verdaccio-deployment

spec:
  type: ClusterIP

  selector:
    app: verdaccio-deployment

  ports:
    - name: http
      port: 80
      targetPort: 4873
      protocol: TCP

---

# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verdaccio-ingress
  namespace: "{{NAMESPACE}}"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - "{{HOSTNAME}}"
      secretName: verdaccio-cert-tls

  rules:
    - host: "{{HOSTNAME}}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: verdaccio-service
                port:
                  number: 80

---

# Allow Verdaccio outbound Internet access
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: allow-verdaccio-internet

spec:
  selector: app == "verdaccio-deployment"
  namespaceSelector: kubernetes.io/metadata.name == "{{NAMESPACE}}"

  types:
    - Egress

  egress:
    - action: Allow
      destination:
        nets:
          - 0.0.0.0/0
